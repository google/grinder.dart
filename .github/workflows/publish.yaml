# A CI configuration to auto-publish pub packages.

name: Publish

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions: {}

jobs:
  publish:
    if: ${{ github.repository_owner == 'google' }}
    permissions:
      pull-requests: write # Create PR comments
      id-token: write # Authenticate via OIDC
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@16dca7ae5d3ff896a4db47e1ed6cd50f7ebbf115
