# A CI configuration to auto-publish package:grinder to pub.dev via OSS Exit Gate.

name: Publish

on:
  push:
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

permissions: {}

jobs:
  validate:
    name: Validate package:grinder
    if: ${{ github.repository_owner == 'google' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify package archive (dry run)
        run: dart pub publish --dry-run

  publish:
    name: Stage and publish package:grinder via OSS Exit Gate
    if: ${{ github.repository_owner == 'google' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Remove prior staged grinder archive if present
        run: |
          gcloud artifacts packages delete "grinder" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="grinder-dart--pubdev" \
            --quiet 2>/dev/null || true

      - name: Stage grinder archive and trigger OSS Exit Gate release
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE="${RUNNER_TEMP}/grinder-${VERSION}.tar.gz"
          tar --exclude='.dart_tool' --exclude='.git' -czf "${ARCHIVE}" .
          gcloud artifacts generic upload \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="grinder-dart--pubdev" \
            --package="grinder" \
            --version="${VERSION}" \
            --source="${ARCHIVE}"
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "grinder",
                    "version": "${VERSION}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/grinder-dart/pubdev/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
